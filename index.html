<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>¿Dónde la veo?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Para que en iPhone se vea como app al agregar a pantalla de inicio -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="¿Dónde la veo?">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 1rem;
      background: #111;
      color: #eee;
    }
    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 1rem;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 1rem;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    label {
      display: block;
      margin-top: 0.5rem;
      margin-bottom: 0.25rem;
      font-size: 0.9rem;
    }
    input, select, button {
      width: 100%;
      padding: 0.6rem;
      margin-bottom: 0.5rem;
      border-radius: 8px;
      border: 1px solid #444;
      font-size: 1rem;
      background: #121212;
      color: #eee;
    }
    button {
      background: #0a84ff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:active {
      background: #0060d0;
    }
    #resultado {
      margin-top: 1rem;
      font-size: 0.95rem;
    }
    .plataforma-grupo {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid #333;
    }
    .tag {
      display: inline-block;
      background: #222;
      border-radius: 999px;
      padding: 0.25rem 0.6rem;
      margin: 0.1rem;
      font-size: 0.8rem;
    }
    .error {
      color: #ff453a;
    }
    .ok {
      color: #30d158;
    }
  </style>
</head>
<body>
  <h1>¿Dónde la veo?</h1>
  <div class="card">
    <label for="titulo">Película o serie</label>
    <input type="text" id="titulo" placeholder="Ej: The Matrix, Los Simpsons">

    <label for="pais">País</label>
    <select id="pais">
      <option value="AR">Argentina</option>
      <option value="US">Estados Unidos</option>
      <option value="ES">España</option>
      <option value="MX">México</option>
      <option value="BR">Brasil</option>
      <option value="CL">Chile</option>
      <option value="UY">Uruguay</option>
      <option value="CO">Colombia</option>
    </select>

    <button id="buscarBtn">Buscar</button>

    <div id="resultado"></div>
  </div>

  <script>
    // PONÉ ACÁ TU API KEY DE TMDb:
    const API_KEY = "f55245eea0e3368324506e9738da89b3";  // <-- reemplazar

    const inputTitulo = document.getElementById("titulo");
    const selectPais = document.getElementById("pais");
    const btnBuscar = document.getElementById("buscarBtn");
    const divResultado = document.getElementById("resultado");

    async function buscarTitulo() {
      const titulo = inputTitulo.value.trim();
      const region = selectPais.value;

      divResultado.innerHTML = "";

      if (!titulo) {
        divResultado.innerHTML = "<p class='error'>Escribí un título primero.</p>";
        return;
      }

      try {
        // 1) Buscar película/serie por nombre (search/multi)
        const urlBusqueda =
          `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}` +
          `&query=${encodeURIComponent(titulo)}&language=es-ES`;

        const respBusqueda = await fetch(urlBusqueda);
        if (!respBusqueda.ok) {
          throw new Error("Error en la búsqueda (" + respBusqueda.status + ")");
        }
        const datosBusqueda = await respBusqueda.json();

        if (!datosBusqueda.results || datosBusqueda.results.length === 0) {
          divResultado.innerHTML = "<p class='error'>No encontré ningún resultado con ese título.</p>";
          return;
        }

        // Tomamos el primer resultado que sea movie o tv
        const resultado = datosBusqueda.results.find(r =>
          r.media_type === "movie" || r.media_type === "tv"
        ) || datosBusqueda.results[0];

        const id = resultado.id;
        const tipo = resultado.media_type; // movie o tv
        const nombre = resultado.title || resultado.name || titulo;
        const anio = (resultado.release_date || resultado.first_air_date || "").slice(0, 4);

        // 2) Pedir proveedores (watch/providers)
        const urlProviders =
          `https://api.themoviedb.org/3/${tipo}/${id}/watch/providers?api_key=${API_KEY}`;

        const respProviders = await fetch(urlProviders);
        if (!respProviders.ok) {
          throw new Error("Error al obtener plataformas (" + respProviders.status + ")");
        }
        const datosProviders = await respProviders.json();

        const porRegion = (datosProviders.results || {})[region];

        // Armamos la salida
        let html = `<p class='ok'><strong>${nombre}</strong> ${anio ? "(" + anio + ")" : ""}</p>`;
        html += `<p>Región seleccionada: <strong>${region}</strong></p>`;

        if (!porRegion) {
          html += "<p class='error'>Para este título no figuran plataformas en esa región.</p>";
        } else {
          const flatrate = porRegion.flatrate || [];
          const buy = porRegion.buy || [];
          const rent = porRegion.rent || [];

          function listaNombres(arr) {
            return arr.map(p => p.provider_name);
          }

          const listaFlatrate = listaNombres(flatrate);
          const listaBuy = listaNombres(buy);
          const listaRent = listaNombres(rent);

          const todas = new Set([...listaFlatrate, ...listaBuy, ...listaRent]);

          if (todas.size === 0) {
            html += "<p class='error'>TMDb no muestra proveedores de streaming para este título en esa región.</p>";
          } else {
            html += "<div class='plataforma-grupo'>";
            if (listaFlatrate.length > 0) {
              html += "<p><strong>Incluido en suscripción:</strong></p>";
              listaFlatrate.forEach(n => {
                html += `<span class='tag'>${n}</span>`;
              });
            }
            if (listaRent.length > 0) {
              html += "<p><strong>Alquiler:</strong></p>";
              listaRent.forEach(n => {
                html += `<span class='tag'>${n}</span>`;
              });
            }
            if (listaBuy.length > 0) {
              html += "<p><strong>Compra:</strong></p>";
              listaBuy.forEach(n => {
                html += `<span class='tag'>${n}</span>`;
              });
            }
            html += "</div>";
          }

          // Link a página de TMDb para ver más info
          if (porRegion.link) {
            html += `<p><a href="${porRegion.link}" target="_blank" style="color:#0a84ff;">Ver detalles en TMDb</a></p>`;
          }
        }

        divResultado.innerHTML = html;

      } catch (err) {
        console.error(err);
        divResultado.innerHTML = "<p class='error'>Ocurrió un error al consultar el servicio.</p>";
      }
    }

    btnBuscar.addEventListener("click", buscarTitulo);
    inputTitulo.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") {
        buscarTitulo();
      }
    });
  </script>
</body>
</html>
